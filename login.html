<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Вхід | ВелоСвіт</title>
    <link rel="stylesheet" href="css/main.css" />
</head>
<body>
    <div class="page-wrapper">
        <!-- Шапка -->
        <header class="site-header">
            <div class="container">
                <h1 class="site-title">ВелоСвіт</h1>
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li><a href="index.html">Головна</a></li>
                        <li><a href="catalog.html">Каталог</a></li>
                        <li><a href="cart.html">Кошик</a></li>
                        <li><a href="profile.html">Профіль</a></li>
                        <li><a href="login.html">Вхід</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Форма входу -->
        <main class="main-content">
            <div class="container">
                <section class="login-section">
                    <h2>Вхід адміністратора</h2>
                    <form action="#" method="POST" class="login-form">

                        <div class="form-group">
                            <label for="username">Логін:</label>
                            <input type="text" id="username" name="username" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Пароль:</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Увійти</button>
                            <a href="index.html" class="btn btn-outline">На головну</a>
                        </div>

                    </form>
                </section>
            </div>
        </main>

        <!-- Футер -->
        <footer class="site-footer">
            <div class="container">
                <p>&copy; 2025 ВелоСвіт. Усі права захищено.</p>
            </div>
        </footer>
    </div>
</body>
</html>
