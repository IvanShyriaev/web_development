<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Додати користувача | ВелоСвіт</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<!-- Шапка -->
<header class="site-header">
  <div class="container">
    <h1 class="site-title">ВелоСвіт — Адмін</h1>
    <nav class="main-nav">
      <ul class="nav-list">
        <li><a href="index.html">Головна</a></li>
        <li><a href="admin-panel.html">Адмін</a></li>
        <li><a href="admin-users.html">Користувачі</a></li>
        <li><a href="profile.html">Профіль</a></li>
        <li><a href="login.html">Вихід</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- Форма додавання користувача -->
<main class="main-content">
  <div class="container">
    <section class="create-user-section">
      <h2>Додати нового користувача</h2>

      <form action="#" method="POST" class="user-form">

        <div class="form-group">
          <label for="name">Ім’я користувача:</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="phone">Телефон:</label>
          <input type="tel" id="phone" name="phone" required>
        </div>

        <div class="form-group">
          <label for="password">Пароль:</label>
          <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
          <label for="role">Роль:</label>
          <select id="role" name="role" required>
            <option value="client">Клієнт</option>
            <option value="admin">Адміністратор</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Додати користувача</button>
          <a href="admin-users.html" class="btn btn-outline">Назад</a>
        </div>

      </form>
    </section>
  </div>
</main>

<!-- Футер -->
<footer class="site-footer">
  <div class="container">
    <p>&copy; 2025 ВелоСвіт. Усі права захищено.</p>
  </div>
</footer>

</body>
</html>
