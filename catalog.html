<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />

    <title>Каталог велосипедів | ВелоСвіт</title>
    <link rel="stylesheet" href="css/main.css" />
</head>
<body>
    <div class="page-wrapper">
<!-- Шапка -->
        <header class="site-header">
            <div class="container">
                <h1 class="site-title">ВелоСвіт</h1>
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li><a href="index.html">Головна</a></li>
                        <li><a href="catalog.html">Каталог</a></li>
                        <li><a href="cart.html">Кошик</a></li>
                        <li><a href="profile.html">Профіль</a></li>
                        <li><a href="login.html">Вхід</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Каталог -->
        <main class="main-content">
            <div class="container">
                <h2>Каталог велосипедів</h2>

                <div class="product-grid">

                    <div class="product-card">
                        <img src="images/bike1.jpg" alt="Гірський велосипед XTR" class="product-image">
                        <h3>Гірський XTR</h3>
                        <p>₴15,500</p>
                        <a href="product.html" class="btn btn-primary">Детальніше</a>
                        <button class="btn btn-success">До кошика</button>
                    </div>

                    <div class="product-card">
                        <img src="images/bike2.jpg" alt="Міський велосипед Retro" class="product-image">
                        <h3>Міський Retro</h3>
                        <p>₴9,300</p>
                        <a href="product.html" class="btn btn-primary">Детальніше</a>
                        <button class="btn btn-success">До кошика</button>
                    </div>

                    <div class="product-card">
                        <img src="images/bike3.jpg" alt="Дитячий велосипед MiniRider" class="product-image">
                        <h3>Дитячий MiniRider</h3>
                        <p>₴5,800</p>
                        <a href="product.html" class="btn btn-primary">Детальніше</a>
                        <button class="btn btn-success">До кошика</button>
                    </div>

                </div>
            </div>

        <!-- Футер -->
        <footer class="site-footer">
            <div class="container">
